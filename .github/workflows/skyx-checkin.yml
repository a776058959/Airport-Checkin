name: "SKY VPN 自动签到"

on:
  schedule:
    - cron: "0 22 * * *"   # 每天 UTC 22:00（北京时间 06:00）
  workflow_dispatch:

env:
  RUN_ENV: 'prod'

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Random sleep
        if: github.event_name == 'schedule'
        run: sleep $(shuf -i 10-600 -n 1)

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run checkin
        env:
          SCKEY: ${{ secrets.SCKEY }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          BASE_URL: ${{ secrets.BASE_URL }}
          PANEL_URL: ${{ secrets.PANEL_URL }}
          TWOFA_CODE: ${{ secrets.TWOFA_CODE }}
          TGBOT: ${{ secrets.TGBOT }}
          TGUSERID: ${{ secrets.TGUSERID }}
        run: python3 ./skyx-checkin.py
