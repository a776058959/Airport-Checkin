name: "SKY VPN 自动签到"

on:
  schedule:
    # GitHub 的 cron 只能指定固定时刻，没法直接随机。
    # 所以这里只设一个凌晨触发点，再在 job 里加一段随机延迟，
    # 把真正的签到请求打散到凌晨的一段区间里，避免每天同一分钟执行。
    #
    # cron 用 UTC：16:07 UTC = 次日 00:07 北京时间
    # 之后随机延迟 0-170 分钟，实际签到落在 00:07-02:57 之间且每天不同。
    # （不用整点 :00，那个时刻大家的定时任务最挤）
    - cron: "7 16 * * *"
  workflow_dispatch:

env:
  RUN_ENV: 'prod'

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 随机延迟，把执行时刻打散。手动触发时跳过，免得白等。
      - name: Random delay
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM * 60 % 10200))
          echo "随机延迟 ${DELAY} 秒（约 $((DELAY / 60)) 分钟）"
          echo "预计执行时刻：$(date -u -d "+${DELAY} seconds" '+%H:%M UTC') / $(TZ=Asia/Shanghai date -d "+${DELAY} seconds" '+%H:%M 北京时间')"
          sleep $DELAY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 面板域名是随机分配的，唯一来源是入口站；而入口站的 continue 接口
      # 有每 IP 配额，Actions 的共享 runner IP 常常已被占满会返回 429。
      # 所以把已发现的面板域名缓存下来跨 run 复用，只有缓存失效时才回入口站。
      - name: Restore panel domain cache
        id: panel-cache
        uses: actions/cache/restore@v4
        with:
          path: .panel-cache
          key: skyx-panel-${{ github.run_id }}
          restore-keys: |
            skyx-panel-

      - name: Run checkin
        env:
          SCKEY: ${{ secrets.SCKEY }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          BASE_URL: ${{ secrets.BASE_URL }}
          PANEL_URL: ${{ secrets.PANEL_URL }}
          TWOFA_CODE: ${{ secrets.TWOFA_CODE }}
          TGBOT: ${{ secrets.TGBOT }}
          TGUSERID: ${{ secrets.TGUSERID }}
        run: python3 ./skyx-checkin.py

      # 缓存命中与否都要保存：命中时原样保存，未命中时脚本已写入新域名
      - name: Save panel domain cache
        if: always() && hashFiles('.panel-cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .panel-cache
          key: skyx-panel-${{ github.run_id }}
