name: "SKY VPN 自动签到"

on:
  schedule:
    - cron: "0 22 * * *"   # 每天 UTC 22:00（北京时间 06:00）
  workflow_dispatch:

env:
  RUN_ENV: 'prod'

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Random sleep
        if: github.event_name == 'schedule'
        run: sleep $(shuf -i 10-600 -n 1)

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 面板域名是随机分配的，唯一来源是入口站；而入口站的 continue 接口
      # 有每 IP 配额，Actions 的共享 runner IP 常常已被占满会返回 429。
      # 所以把已发现的面板域名缓存下来跨 run 复用，只有缓存失效时才回入口站。
      - name: Restore panel domain cache
        id: panel-cache
        uses: actions/cache/restore@v4
        with:
          path: .panel-cache
          key: skyx-panel-${{ github.run_id }}
          restore-keys: |
            skyx-panel-

      - name: Run checkin
        env:
          SCKEY: ${{ secrets.SCKEY }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          BASE_URL: ${{ secrets.BASE_URL }}
          PANEL_URL: ${{ secrets.PANEL_URL }}
          TWOFA_CODE: ${{ secrets.TWOFA_CODE }}
          TGBOT: ${{ secrets.TGBOT }}
          TGUSERID: ${{ secrets.TGUSERID }}
        run: python3 ./skyx-checkin.py

      # 缓存命中与否都要保存：命中时原样保存，未命中时脚本已写入新域名
      - name: Save panel domain cache
        if: always() && hashFiles('.panel-cache') != ''
        uses: actions/cache/save@v4
        with:
          path: .panel-cache
          key: skyx-panel-${{ github.run_id }}
