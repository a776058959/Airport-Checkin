name: "SKY VPN 自动签到"

on:
  schedule:
    # 三个候选时间点（UTC），间隔 2 小时，对应北京时间：
    #   16:10 UTC -> 次日 00:10
    #   18:10 UTC -> 次日 02:10
    #   20:10 UTC -> 次日 04:10
    #
    # 每次都先看「今天是否已签到成功」：成功过就跳过；
    # 否则第 1、2 个时间点按概率抽取（不一定跑），第 3 个保底必跑。
    # 这样每天的签到时刻是随机的，又不靠长时间 sleep 占着 runner。
    - cron: "10 16 * * *"
    - cron: "10 18 * * *"
    - cron: "10 20 * * *"
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 恢复两个东西：
      #   .panel-cache —— 面板地址（避免每次都撞入口站限流）
      #   state/       —— 记录今天是否已签到成功
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .panel-cache
            state
          key: skyx-${{ github.run_id }}
          restore-keys: |
            skyx-

      # 决定这次要不要真的签到
      # 决定这次要不要真的签到。
      #
      # 不用 github.event.schedule 匹配 cron 字符串（格式细节不可靠），
      # 直接看当前 UTC 小时落在哪个时间段——比字符串匹配稳。
      #   16 点 -> 第 1 个（北京 00:10，40% 概率跑）
      #   18 点 -> 第 2 个（北京 02:10，50% 概率跑）
      #   其它 -> 第 3 个（北京 04:10，保底必跑）
      - name: Decide whether to run
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu
          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          LAST=$(cat state/last-success.txt 2>/dev/null || echo "")
          HOUR=$(date -u +%H)

          echo "今天（北京时间）：$TODAY"
          echo "触发方式：$EVENT_NAME"
          echo "当前 UTC 小时：$HOUR"
          echo "上次成功：${LAST:-（无记录）}"

          # 手动触发：无条件执行（方便调试）
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "→ 手动触发，直接执行"
            exit 0
          fi

          # 今天已经签到成功过：跳过
          if [ "$LAST" = "$TODAY" ]; then
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "→ 今天已签到成功，跳过本次"
            exit 0
          fi

          # 按 UTC 小时决定策略
          case "$HOUR" in
            16) P=40; SLOT="第 1 个（北京 00:xx）" ;;
            17) P=40; SLOT="第 1 个（延迟到 01:xx）" ;;
            18) P=50; SLOT="第 2 个（北京 02:xx）" ;;
            19) P=50; SLOT="第 2 个（延迟到 03:xx）" ;;
            *)
              echo "run=yes" >> "$GITHUB_OUTPUT"
              echo "→ 第 3 个（北京 04:xx 及以后）保底，必定执行"
              exit 0
              ;;
          esac

          R=$((RANDOM % 100))
          if [ "$R" -lt "$P" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "→ $SLOT 命中随机（$R < $P），执行"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "→ $SLOT 随机跳过（$R >= $P），留给后面时间点"
          fi

      - name: Install dependencies
        if: steps.decide.outputs.run == 'yes'
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run checkin
        id: checkin
        if: steps.decide.outputs.run == 'yes'
        continue-on-error: true
        env:
          SCKEY: ${{ secrets.SCKEY }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          BASE_URL: ${{ secrets.BASE_URL }}
          PANEL_URL: ${{ secrets.PANEL_URL }}
          TWOFA_CODE: ${{ secrets.TWOFA_CODE }}
          TGBOT: ${{ secrets.TGBOT }}
          TGUSERID: ${{ secrets.TGUSERID }}
        run: python3 ./skyx-checkin.py

      # 只在真正成功时记「今天已完成」，失败则留给后面的时间点重试
      - name: Mark today as done
        if: steps.decide.outputs.run == 'yes' && steps.checkin.outcome == 'success'
        run: |
          mkdir -p state
          TZ=Asia/Shanghai date +%Y-%m-%d > state/last-success.txt
          echo "已记录：$(cat state/last-success.txt) 签到成功"

      - name: Save cache
        if: always() && steps.decide.outputs.run == 'yes'
        uses: actions/cache/save@v4
        with:
          path: |
            .panel-cache
            state
          key: skyx-${{ github.run_id }}

      # 签到失败且这是最后一个时间点时，让 job 标红，方便你发现
      - name: Fail if checkin failed
        if: steps.decide.outputs.run == 'yes' && steps.checkin.outcome != 'success'
        run: |
          echo "签到失败，等下一个时间点重试"
          exit 1
